{%- assign base_id = product.id | default: 'page' -%}
{%- assign fc_uid = base_id | append: '-' | append: section.id -%}

<!-- Calculator wrapper scoped to the current Shopify section instance. -->
<section id="fc-{{ fc_uid }}" class="fc-wrap">
  <div class="fc-card">
    <!-- Header: title plus primary daily-ration output. -->
    <div class="fc-header">
      <h2 class="fc-title">Feeding Calculator</h2>
      <div class="fc-result-main">
        <span class="fc-label-main">Daily Ration</span>
        <strong id="fc-out-main-{{ fc_uid }}" class="fc-main-val">- g/day</strong>
      </div>
    </div>

    <!-- Pet name is used only for personalized copy and cart properties. -->
    <div class="fc-field">
      <label class="fc-label" for="dog-name-{{ fc_uid }}">Dog’s name</label>
      <input
        type="text"
        id="dog-name-{{ fc_uid }}"
        name="properties[Dog’s name]"
        class="fc-input"
        data-fc="pet-name"
        placeholder="e.g. Rocky"
      >
    </div>

    <!-- Inputs are populated and controlled by the inline script below. -->
    <div class="fc-grid">
      <div class="fc-field">
        <label class="fc-label" for="fc-age-{{ fc_uid }}">Age</label>
        <select id="fc-age-{{ fc_uid }}" class="fc-select" data-fc="age"></select>
      </div>

      <div class="fc-field">
        <label class="fc-label" for="fc-w-{{ fc_uid }}">Weight</label>
        <select
          id="fc-w-{{ fc_uid }}"
          class="fc-select"
          data-fc="weight"
        ></select>
      </div>

      <div class="fc-field" id="fc-activity-wrap-{{ fc_uid }}" data-fc="activity-wrap" style="display:none;">
        <label class="fc-label" for="fc-activity-{{ fc_uid }}">Activity</label>
        <select id="fc-activity-{{ fc_uid }}" class="fc-select" data-fc="activity"></select>
      </div>
    </div>

    <div class="fc-divider"></div>

    <!-- Calculated output and explanatory text. -->
    <div class="fc-results">
      <div class="fc-row">
        <span class="fc-k">Daily ration</span>
        <strong id="fc-out-g-{{ fc_uid }}" class="fc-v" data-fc="out-g">- g/day</strong>
      </div>

      <div id="fc-summary-{{ fc_uid }}" class="fc-summary-box" data-fc="summary" style="display:none;">
        <p id="sum-basic-{{ fc_uid }}" data-fc="sum-basic"></p>
        <p id="sum-generic-{{ fc_uid }}" data-fc="sum-generic"></p>
        <p id="sum-personal-{{ fc_uid }}" data-fc="sum-personal"></p>
      </div>

      <p class="fc-note">Indicative result. Adjust according to activity and body condition.</p>
    </div>
  </div>

  <!-- Local styling is kept here because this template is shipped as a self-contained block. -->
  <style>
    .fc-card{
      border:1px solid #e5e7eb;
      border-radius:16px;
      padding:18px;
      background:#fff;
      box-sizing:border-box;
    }
    .fc-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
      gap:8px;
      margin-bottom:10px;
    }
    .fc-title{
      font-size:1.2rem;
      font-weight:700;
      color:#0f948f;
      margin:0;
    }
    .fc-result-main{
      display:flex;
      flex-direction:column;
      align-items:flex-end;
    }
    .fc-label-main{
      font-weight:700;
      color:#0f948f;
    }
    .fc-main-val{
      font-size:1.1rem;
      color:#0f948f;
    }
    .fc-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:12px;
      margin-top:8px;
    }
    @media(max-width:760px){
      .fc-grid{grid-template-columns:repeat(2,1fr);}
    }
    @media(max-width:520px){
      .fc-grid{grid-template-columns:1fr;}
    }
    .fc-field{
      display:flex;
      flex-direction:column;
      gap:6px;
      min-width:0;
    }
    .fc-label{font-weight:600;}
    .fc-select,
    .fc-input{
      width:100%;
      border:1px solid #d1d5db;
      border-radius:10px;
      padding:8px 10px;
      background:#fff;
      font-size:0.95rem;
      box-sizing:border-box;
    }
    .fc-divider{
      margin:16px 0;
      border-top:1px dashed #e5e7eb;
    }
    .fc-results{
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .fc-row{
      display:flex;
      justify-content:space-between;
      align-items:center;
    }
    .fc-k{color:#4b5563;}
    .fc-v{font-weight:700;}
    .fc-summary-box{
      background:#f4fdfc;
      padding:18px 20px;
      border-radius:12px;
      margin-top:4px;
      font-size:0.98rem;
      line-height:1.55;
      color:#111827;
    }
    .fc-summary-box b{
      font-weight:700;
    }
    .fc-note{
      margin-top:8px;
      font-size:0.9rem;
      color:#6b7280;
    }
  </style>

  <!-- Inline engine: populate fields, calculate ration, and keep the UI in sync. -->
  <script>
  (function(){
    // Core ration data copied from the source table.
    var CONFIG = {
      "label": "dog",
      "weight": { "minKg": 1, "maxKg": 70, "minLb": 3, "maxLb": 154, "defaultLb": 11 },
      "stages": {
        "senior_7_plus": {
          "label": "Senior 7+ Years",
          "factors": { "low": 20, "avg": 22 },
          "activity": [
            { "value": "low", "label": "Low Activity or Heavy" },
            { "value": "avg", "label": "Average Activity" }
          ]
        },
        "senior_1_7": {
          "label": "Adult 1–7 Years",
          "factors": { "low": 20, "avg": 25, "high": 30 },
          "activity": [
            { "value": "low", "label": "Low Activity or Heavy" },
            { "value": "avg", "label": "Average Activity" },
            { "value": "high", "label": "High Activity" }
          ]
        },
        "adult_over_1_7": {
          "label": "Adult (1–7 Years) Overweight",
          "factor": 20
        },
        "puppy_2_4": {
          "label": "Puppy 2-4 Months",
          "factor": 100
        },
        "puppy_4_6": {
          "label": "Puppy 4-6 Months",
          "factor": 80
        },
        "puppy_6_8": {
          "label": "Puppy 6-8 Months",
          "factor": 60
        },
        "puppy_8_10": {
          "label": "Puppy 8-10 Months",
          "factor": 40
        },
        "puppy_10_12": {
          "label": "Puppy 10-12 Months",
          "factor": 30
        }
      }
    };

    // Keep the original pound-based UI while calculating against kg thresholds.
    var LB_PER_KG = 2.2046226218;

    function poundsToKg(weightLb){
      return Number(weightLb) / LB_PER_KG;
    }

    // Lookup helpers keep the calculation logic narrow and readable.
    function getStage(stage){
      return CONFIG.stages[stage]
        ? CONFIG.stages[stage]
        : null;
    }

    function getFactor(stage, activity){
      var data = getStage(stage);
      if(!data) return null;
      if(typeof data.factor === "number") return data.factor;
      return data.factors && typeof data.factors[activity] === "number"
        ? data.factors[activity]
        : null;
    }

      // Daily ration equals weight in kg multiplied by the selected stage factor.
    function calculateRation(stage, weightLb, activity){
      var factor = getFactor(stage, activity || "avg");
      var weightKg = poundsToKg(weightLb);
      if(factor === null || !isFinite(weightKg)) return null;
      if(weightKg < CONFIG.weight.minKg || weightKg > CONFIG.weight.maxKg) return null;
      return Math.round(weightKg * factor);
    }

    function calculateBags(gramsPerDay){
      var weekly = gramsPerDay * 7;
      return {
        weekly: weekly,
        bags250: Math.ceil(weekly / 250),
        bags510: Math.ceil(weekly / 510)
      };
    }

    // Scope all DOM work to the current template instance.
    var root = document.currentScript && document.currentScript.closest
      ? document.currentScript.closest(".fc-wrap")
      : document.getElementById("fc-{{ fc_uid }}");
    if(!root) return;

    function find(name){
      return root.querySelector('[data-fc="' + name + '"]');
    }

    var ageEl=find("age");
    var wEl=find("weight");
    var actWrap=find("activity-wrap");
    var actSel=find("activity");
    var dogNameEl=find("pet-name");

    var outMain=root.querySelector(".fc-main-val");
    var outG=find("out-g");

    var box=find("summary");
    var sumBasic=find("sum-basic");
    var sumGeneric=find("sum-generic");
    var sumPersonal=find("sum-personal");
    if(!ageEl || !wEl || !actWrap || !actSel || !dogNameEl || !outMain || !outG || !box || !sumBasic || !sumGeneric || !sumPersonal) return;

    // Number formatting stays consistent across all outputs.
    var nf = new Intl.NumberFormat("en-US");

    // Populate the age dropdown from the shared configuration.
    function fillAge(){
      var stages = CONFIG.stages;
      ageEl.innerHTML = "";
      Object.keys(stages).forEach(function(key){
        var option = document.createElement("option");
        option.value = key;
        option.textContent = stages[key].label;
        ageEl.appendChild(option);
      });
      ageEl.value = "puppy_4_6";
      fillWeight();
    }

    // Populate the weight dropdown in one-pound increments.
    function fillWeight(){
      var current = Number(wEl.value);
      var min = CONFIG.weight.minLb;
      var max = CONFIG.weight.maxLb;
      wEl.innerHTML = "";
      for(var lb = min; lb <= max; lb += 1){
        var option = document.createElement("option");
        option.value = String(lb);
        option.textContent = lb + " lb";
        wEl.appendChild(option);
      }
      if(current >= min && current <= max){
        wEl.value = String(current);
      } else {
        wEl.value = String(CONFIG.weight.defaultLb);
      }
    }

    // Only show activity options for stages that support them.
    function fillActivity(){
      var stage = getStage(ageEl.value);
      actSel.innerHTML = "";
      if(!stage || !stage.activity){
        actWrap.style.display = "none";
        return;
      }
      actWrap.style.display = "";
      stage.activity.forEach(function(item){
        actSel.add(new Option(item.label, item.value, item.value === "avg", item.value === "avg"));
      });
    }

    // Reset the visible results when the current combination is not valid.
    function showEmpty(){
      outMain.textContent = "- g/day";
      outG.textContent = "- g/day";
      box.style.display = "none";
    }

    // Update all outputs together to avoid stale partial results.
    function calculate(){
      var grams = calculateRation(ageEl.value, wEl.value, actSel.value);
      if(grams === null){
        showEmpty();
        return;
      }

      var bags = calculateBags(grams);
      var name = (dogNameEl.value || "").trim();

      outMain.textContent = nf.format(grams) + " g/day";
      outG.textContent = nf.format(grams) + " g/day";

      sumBasic.innerHTML =
        "<b>Feeding summary:</b> " +
        nf.format(grams) + " g/day · " +
        nf.format(bags.weekly) + " g/week";

      if(name){
        sumGeneric.style.display = "none";
        sumPersonal.style.display = "";
        sumPersonal.textContent =
          name + "'s ideal weekly portion is " +
          nf.format(bags.weekly) +
          " grams. We recommend getting " +
          nf.format(bags.bags250) +
          " of the 250 g bags or " +
          nf.format(bags.bags510) +
          " of the 510 g bags, which will cover their meals for the entire week.";
      } else {
        sumGeneric.style.display = "";
        sumPersonal.style.display = "none";
        sumGeneric.textContent =
          "The ideal weekly portion for your dog is " +
          nf.format(bags.weekly) +
          " grams. We recommend getting " +
          nf.format(bags.bags250) +
          " of the 250 g bags or " +
          nf.format(bags.bags510) +
          " of the 510 g bags, which will last the whole week.";
      }

      box.style.display = "block";
    }

    ageEl.addEventListener("change",function(){
      fillActivity();
      calculate();
    });
    wEl.addEventListener("change",calculate);
    actSel.addEventListener("change",calculate);
    // Recalculate immediately as the user changes inputs.
    dogNameEl.addEventListener("input",calculate);

    fillAge();
    fillActivity();
    calculate();
  })();
  </script>
</section>
